<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #1DB954, #1ed760);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }

        .btn-primary {
            background: #1DB954;
            color: white;
        }

        .btn-primary:hover {
            background: #1ed760;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .playlist-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .playlist-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }

        .playlist-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .playlist-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .playlist-info {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .analysis-section {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #1DB954;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .mood-badge {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(45deg, #1DB954, #1ed760);
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .track-list {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .track-item:last-child {
            border-bottom: none;
        }

        .track-info {
            flex: 1;
        }

        .track-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .track-artist {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .track-bpm {
            font-weight: 600;
            color: #1DB954;
            min-width: 60px;
        }

        .recommendations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .rec-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .rec-card:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .rec-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .rec-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rec-artist {
            font-size: 0.8rem;
            opacity: 0.7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .compare-section {
            display: none;
        }

        .compare-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .compare-input {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin-bottom: 10px;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .compare-results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .diagnostics {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #1DB954;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }

        .navigation {
            margin-bottom: 20px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            margin-right: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .nav-btn.active {
            background: #1DB954;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .compare-inputs {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Spotify Playlist Analyzer</h1>
            <p>Analyze, compare, and discover insights from your Spotify playlists</p>
        </div>

        <div class="auth-section" id="authSection">
            <button class="btn btn-primary" id="loginBtn">Login with Spotify</button>
        </div>

        <div class="navigation" id="navigation" style="display: none;">
            <button class="nav-btn active" onclick="showDashboard()">Dashboard</button>
            <button class="nav-btn" onclick="showCompare()">Compare Playlists</button>
            <button class="btn btn-secondary" id="logoutBtn" onclick="logout()" style="float: right;">Logout</button>
        </div>

        <div id="userInfo" style="display: none;"></div>

        <div id="dashboard">
            <div id="playlistsGrid" class="playlist-grid"></div>
        </div>

        <div class="analysis-section" id="analysisSection">
            <button class="btn btn-secondary" onclick="showDashboard()" style="margin-bottom: 20px;">← Back to Dashboard</button>
            <div id="analysisContent"></div>
        </div>

        <div class="compare-section" id="compareSection">
            <div class="card">
                <h2>Compare Two Playlists</h2>
                <div class="compare-inputs">
                    <div class="compare-input">
                        <h3>Playlist A</h3>
                        <select id="playlistA" class="input-field">
                            <option value="">Select a playlist...</option>
                        </select>
                        <input type="text" id="playlistAUrl" class="input-field" placeholder="Or paste Spotify URL/ID">
                    </div>
                    <div class="compare-input">
                        <h3>Playlist B</h3>
                        <select id="playlistB" class="input-field">
                            <option value="">Select a playlist...</option>
                        </select>
                        <input type="text" id="playlistBUrl" class="input-field" placeholder="Or paste Spotify URL/ID">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="comparePlaylists()">Compare Playlists</button>
                <div id="compareResults"></div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CLIENT_ID = 'e1f9fff1018746c09f5b58ce3a1c7c7c'; // Replace with your Spotify Client ID
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const SCOPES = 'user-read-private user-read-email playlist-read-private playlist-read-collaborative';

        // Global state
        let accessToken = null;
        let currentUser = null;
        let playlists = [];
        let currentPlaylist = null;

        // Utility functions
        function generateCodeVerifier() {
            const array = new Uint8Array(32);
            window.crypto.getRandomValues(array);
            return btoa(String.fromCharCode.apply(null, array))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        }

        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        }

        // Authentication
        async function initiateSpotifyLogin() {
            const codeVerifier = generateCodeVerifier();
            localStorage.setItem('code_verifier', codeVerifier);

            const codeChallenge = await generateCodeChallenge(codeVerifier);

            const params = new URLSearchParams({
                client_id: CLIENT_ID,
                response_type: 'code',
                redirect_uri: REDIRECT_URI,
                scope: SCOPES,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
            });

            window.location.href = `https://accounts.spotify.com/authorize?${params}`;
        }

        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');

            if (error) {
                showError('Authentication failed: ' + error);
                return;
            }

            if (code) {
                const codeVerifier = localStorage.getItem('code_verifier');
                if (!codeVerifier) {
                    showError('Code verifier not found');
                    return;
                }

                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            client_id: CLIENT_ID,
                            grant_type: 'authorization_code',
                            code: code,
                            redirect_uri: REDIRECT_URI,
                            code_verifier: codeVerifier,
                        }),
                    });

                    const data = await response.json();
                    if (response.ok) {
                        accessToken = data.access_token;
                        localStorage.setItem('spotify_access_token', accessToken);
                        localStorage.removeItem('code_verifier');
                        
                        // Clean up URL
                        window.history.replaceState({}, document.title, window.location.pathname);
                        
                        await initializeApp();
                    } else {
                        showError('Token exchange failed: ' + data.error_description);
                    }
                } catch (error) {
                    showError('Network error during token exchange: ' + error.message);
                }
            }
        }

        // API functions
        async function spotifyFetch(endpoint, options = {}) {
            if (!accessToken) {
                throw new Error('No access token available');
            }

            const response = await fetch(`https://api.spotify.com/v1${endpoint}`, {
                ...options,
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/json',
                    ...options.headers,
                },
            });

            if (response.status === 429) {
                const retryAfter = response.headers.get('Retry-After');
                if (retryAfter) {
                    await new Promise(resolve => setTimeout(resolve, parseInt(retryAfter) * 1000));
                    return spotifyFetch(endpoint, options);
                }
            }

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 300)}`);
            }

            return response.json();
        }

        async function getCurrentUser() {
            return await spotifyFetch('/me');
        }

        async function getUserPlaylists() {
            let allPlaylists = [];
            let offset = 0;
            const limit = 50;

            while (true) {
                const response = await spotifyFetch(`/me/playlists?offset=${offset}&limit=${limit}`);
                allPlaylists = allPlaylists.concat(response.items);
                
                if (response.items.length < limit) {
                    break;
                }
                offset += limit;
            }

            return allPlaylists;
        }

        async function getPlaylistTracks(playlistId) {
            let allTracks = [];
            let offset = 0;
            const limit = 100;

            while (true) {
                const response = await spotifyFetch(`/playlists/${playlistId}/tracks?offset=${offset}&limit=${limit}`);
                allTracks = allTracks.concat(response.items.filter(item => item.track && item.track.id));
                
                if (response.items.length < limit) {
                    break;
                }
                offset += limit;
            }

            return allTracks;
        }

        async function getAudioFeatures(trackIds) {
            const features = [];
            
            // Process in batches of 100
            for (let i = 0; i < trackIds.length; i += 100) {
                const batch = trackIds.slice(i, i + 100);
                const response = await spotifyFetch(`/audio-features?ids=${batch.join(',')}`);
                features.push(...response.audio_features.filter(f => f !== null));
            }
            
            return features;
        }

        async function getRecommendations(seedArtists, seedTracks, targetFeatures) {
            const params = new URLSearchParams({
                seed_artists: seedArtists.slice(0, 2).join(','),
                seed_tracks: seedTracks.slice(0, 3).join(','),
                limit: 20,
                target_tempo: targetFeatures.tempo,
                target_energy: targetFeatures.energy,
                target_valence: targetFeatures.valence,
                target_danceability: targetFeatures.danceability,
            });

            return await spotifyFetch(`/recommendations?${params}`);
        }

        // Analysis functions
        function calculatePlaylistStats(tracks, audioFeatures) {
            const totalTracks = tracks.length;
            const totalDuration = tracks.reduce((sum, track) => sum + track.track.duration_ms, 0);
            
            const validFeatures = audioFeatures.filter(f => f !== null);
            const avgTempo = validFeatures.reduce((sum, f) => sum + f.tempo, 0) / validFeatures.length;
            const avgEnergy = validFeatures.reduce((sum, f) => sum + f.energy, 0) / validFeatures.length;
            const avgValence = validFeatures.reduce((sum, f) => sum + f.valence, 0) / validFeatures.length;
            const avgDanceability = validFeatures.reduce((sum, f) => sum + f.danceability, 0) / validFeatures.length;

            return {
                totalTracks,
                totalDuration: Math.round(totalDuration / 60000),
                avgTempo: Math.round(avgTempo),
                avgEnergy: Math.round(avgEnergy * 100),
                avgValence: Math.round(avgValence * 100),
                avgDanceability: Math.round(avgDanceability * 100),
            };
        }

        function getMoodLabel(energy, valence) {
            if (energy > 0.6 && valence > 0.6) return 'Bright & Energetic';
            if (energy > 0.6 && valence < 0.4) return 'Intense & Aggressive';
            if (energy < 0.4 && valence > 0.6) return 'Happy & Chill';
            if (energy < 0.4 && valence < 0.4) return 'Moody & Chill';
            return 'Balanced';
        }

        function findDuplicates(tracks) {
            const trackCounts = {};
            const duplicates = [];

            tracks.forEach(item => {
                const trackId = item.track.id;
                trackCounts[trackId] = (trackCounts[trackId] || 0) + 1;
            });

            Object.entries(trackCounts).forEach(([trackId, count]) => {
                if (count > 1) {
                    const track = tracks.find(item => item.track.id === trackId);
                    duplicates.push({
                        track: track.track,
                        count
                    });
                }
            });

            return duplicates;
        }

        function findTempoOutliers(tracks, audioFeatures) {
            const tempos = audioFeatures.map(f => f.tempo);
            const mean = tempos.reduce((sum, t) => sum + t, 0) / tempos.length;
            const variance = tempos.reduce((sum, t) => sum + Math.pow(t - mean, 2), 0) / tempos.length;
            const stdDev = Math.sqrt(variance);

            const outliers = [];
            audioFeatures.forEach((features, index) => {
                const zScore = Math.abs((features.tempo - mean) / stdDev);
                if (zScore > 2) {
                    const track = tracks.find(item => item.track.id === features.id);
                    if (track) {
                        outliers.push({
                            track: track.track,
                            tempo: Math.round(features.tempo),
                            zScore: zScore.toFixed(2)
                        });
                    }
                }
            });

            return {
                mean: Math.round(mean),
                stdDev: Math.round(stdDev),
                outliers: outliers.sort((a, b) => b.zScore - a.zScore)
            };
        }

        function createSmoothOrder(tracks, audioFeatures) {
            // Create track-feature pairs
            const trackFeaturePairs = tracks.map(item => {
                const features = audioFeatures.find(f => f.id === item.track.id);
                return { track: item.track, features };
            }).filter(pair => pair.features);

            if (trackFeaturePairs.length === 0) return [];

            // Start with track closest to median tempo
            const tempos = trackFeaturePairs.map(pair => pair.features.tempo);
            tempos.sort((a, b) => a - b);
            const medianTempo = tempos[Math.floor(tempos.length / 2)];

            let currentTrack = trackFeaturePairs.reduce((closest, pair) => {
                const diff = Math.abs(pair.features.tempo - medianTempo);
                const closestDiff = Math.abs(closest.features.tempo - medianTempo);
                return diff < closestDiff ? pair : closest;
            });

            const orderedTracks = [currentTrack];
            const remainingTracks = trackFeaturePairs.filter(pair => pair !== currentTrack);

            // Greedy nearest neighbor by tempo
            while (remainingTracks.length > 0) {
                const currentTempo = currentTrack.features.tempo;
                let nearestTrack = remainingTracks[0];
                let minDistance = Math.abs(nearestTrack.features.tempo - currentTempo);

                remainingTracks.forEach(track => {
                    const distance = Math.abs(track.features.tempo - currentTempo);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearestTrack = track;
                    }
                });

                orderedTracks.push(nearestTrack);
                currentTrack = nearestTrack;
                remainingTracks.splice(remainingTracks.indexOf(nearestTrack), 1);
            }

            return orderedTracks;
        }

        // UI functions
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.innerHTML = `<strong>Error:</strong> ${message}`;
            document.body.appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 10000);
        }

        function showLoading(container, message = 'Loading...') {
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>${message}</p>
                </div>
            `;
        }

                    <div>
                        <h3>${user.display_name || 'User'}</h3>
                        <p style="opacity: 0.7;">${user.email || user.id}</p>
                    </div>
                </div>
            `;
        }

        function displayPlaylists(playlists) {
            const grid = document.getElementById('playlistsGrid');
            grid.innerHTML = playlists.map(playlist => `

        async function analyzePlaylist(playlistId) {

        async function getPlaylistRecommendations(playlistId) {
            const recContainer = document.getElementById('recommendations');
            showLoading(recContainer, 'Getting recommendations...');

            try {
                const tracks = await getPlaylistTracks(playlistId);
                const trackIds = tracks.map(item => item.track.id);
                const audioFeatures = await getAudioFeatures(trackIds);
                
                // Get top artists
                const artistCounts = {};
                tracks.forEach(item => {
                    item.track.artists.forEach(artist => {
                        artistCounts[artist.id] = (artistCounts[artist.id] || 0) + 1;
                    });
                });
                
                const topArtists = Object.entries(artistCounts)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 2)
                    .map(([artistId]) => artistId);

                // Calculate target features
                const validFeatures = audioFeatures.filter(f => f);
                const targetFeatures = {
                    tempo: Math.round(validFeatures.reduce((sum, f) => sum + f.tempo, 0) / validFeatures.length),
                    energy: validFeatures.reduce((sum, f) => sum + f.energy, 0) / validFeatures.length,
                    valence: validFeatures.reduce((sum, f) => sum + f.valence, 0) / validFeatures.length,
                    danceability: validFeatures.reduce((sum, f) => sum + f.danceability, 0) / validFeatures.length,
                };

                // Get random sample of track IDs for seeds
                const seedTracks = trackIds.sort(() => 0.5 - Math.random()).slice(0, 3);

                const recommendations = await getRecommendations(topArtists, seedTracks, targetFeatures);

                recContainer.innerHTML = `
                    <div class="recommendations-grid">
                        ${recommendations.tracks.map(track => `
                            <div class="rec-card">
                                <img src="${track.album.images[0]?.url || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgdmlld0JveD0iMCAwIDEyMCAxMjAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIiBmaWxsPSIjMUVENzYwIi8+Cjx0ZXh0IHg9IjYwIiB5PSI2NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiIGZvbnQtc2l6ZT0iMTQiPk11c2ljPC90ZXh0Pgo8L3N2Zz4K'}" alt="Album Cover" class="rec-image">
                                <div class="rec-name">${track.name}</div>
                                <div class="rec-artist">${track.artists.map(a => a.name).join(', ')}</div>
                                <a href="${track.external_urls.spotify}" target="_blank" class="btn btn-secondary" style="margin-top: 10px; font-size: 0.8rem; padding: 5px 10px;">Open in Spotify</a>
                            </div>
                        `).join('')}
                    </div>
                `;

            } catch (error) {
                recContainer.innerHTML = `<div class="error">Failed to get recommendations: ${error.message}</div>`;
            }
        }

        async function runDiagnostics(playlistId) {
            const resultsContainer = document.getElementById('diagnosticsResults');
            resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>Running diagnostics...</p></div>';

            try {
                // Test audio features endpoint
                const tracks = await getPlaylistTracks(playlistId);
                const sampleTrackIds = tracks.slice(0, 5).map(item => item.track.id);
                
                const featuresTest = await fetch(`https://api.spotify.com/v1/audio-features?ids=${sampleTrackIds.join(',')}`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                const featuresData = await featuresTest.json();

                // Test recommendations endpoint
                const recTest = await fetch(`https://api.spotify.com/v1/recommendations?seed_tracks=${sampleTrackIds.slice(0, 3).join(',')}&limit=5`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                const recData = await recTest.json();

                resultsContainer.innerHTML = `
                    <div style="margin-top: 15px;">
                        <strong>Audio Features Test:</strong><br>
                        Status: ${featuresTest.status}<br>
                        Response: <code>${JSON.stringify(featuresData).substring(0, 300)}...</code><br><br>
                        
                        <strong>Recommendations Test:</strong><br>
                        Status: ${recTest.status}<br>
                        Response: <code>${JSON.stringify(recData).substring(0, 300)}...</code>
                    </div>
                `;

            } catch (error) {
                resultsContainer.innerHTML = `<div class="error">Diagnostics failed: ${error.message}</div>`;
            }
        }

        // Compare functionality
        async function comparePlaylists() {
            const playlistAId = document.getElementById('playlistA').value || extractPlaylistId(document.getElementById('playlistAUrl').value);
            const playlistBId = document.getElementById('playlistB').value || extractPlaylistId(document.getElementById('playlistBUrl').value);

            if (!playlistAId || !playlistBId) {
                showError('Please select or enter two playlists to compare');
                return;
            }

            const resultsContainer = document.getElementById('compareResults');
            showLoading(resultsContainer, 'Comparing playlists...');

            try {
                const [tracksA, tracksB] = await Promise.all([
                    getPlaylistTracks(playlistAId),
                    getPlaylistTracks(playlistBId)
                ]);

                const trackIdsA = new Set(tracksA.map(item => item.track.id));
                const trackIdsB = new Set(tracksB.map(item => item.track.id));

                const overlap = tracksA.filter(item => trackIdsB.has(item.track.id));
                const onlyA = tracksA.filter(item => !trackIdsB.has(item.track.id));
                const onlyB = tracksB.filter(item => !trackIdsA.has(item.track.id));

                resultsContainer.innerHTML = `
                    <div class="compare-results">

                            <div class="track-list">

                            <div class="track-list">
                                ${onlyA.slice(0, 20).map(item => `

                                        <div class="track-info">
                                            <div class="track-name">${item.track.name}</div>
                                            <div class="track-artist">${item.track.artists.map(a => a.name).join(', ')}</div>

        }

        function extractPlaylistId(url) {
            if (!url) return '';
            
            // Handle various Spotify URL formats
            const patterns = [
                /playlist\/([a-zA-Z0-9]+)/,
                /^([a-zA-Z0-9]+)$/
            ];

            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }

            return '';
        }

        function exportToCSV(dataJson, filename) {
            const data = JSON.parse(dataJson.replace(/&quot;/g, '"'));
            
            if (data.length === 0) {
                showError('No data to export');
                return;
            }

            const headers = Object.keys(data[0]);
            const csvContent = [
                headers.join(','),
                ...data.map(row => headers.map(header => `"${row[header] || ''}"`).join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Navigation
        function showDashboard() {
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('analysisSection').style.display = 'none';
            document.getElementById('compareSection').style.display = 'none';
            
            // Update nav buttons
            const navBtns = document.querySelectorAll('.nav-btn');
            navBtns.forEach(btn => btn.classList.remove('active'));
            navBtns[0].classList.add('active');
        }

        function showAnalysisSection() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('analysisSection').style.display = 'block';
            document.getElementById('compareSection').style.display = 'none';
        }

        function showCompare() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('analysisSection').style.display = 'none';
            document.getElementById('compareSection').style.display = 'block';
            
            // Update nav buttons
            const navBtns = document.querySelectorAll('.nav-btn');
            navBtns.forEach(btn => btn.classList.remove('active'));
            navBtns[1].classList.add('active');
            
            // Populate playlist selectors
            const selectA = document.getElementById('playlistA');
            const selectB = document.getElementById('playlistB');
            
            const options = playlists.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            selectA.innerHTML = '<option value="">Select a playlist...</option>' + options;
            selectB.innerHTML = '<option value="">Select a playlist...</option>' + options;
        }

        function logout() {
            accessToken = null;
            currentUser = null;
            playlists = [];
            localStorage.removeItem('spotify_access_token');
            
            // Hide authenticated sections
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('navigation').style.display = 'none';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('analysisSection').style.display = 'none';
            document.getElementById('compareSection').style.display = 'none';
            
            // Clear content
            document.getElementById('playlistsGrid').innerHTML = '';
            document.getElementById('analysisContent').innerHTML = '';
            document.getElementById('compareResults').innerHTML = '';
        }

        // Initialization
        async function initializeApp() {
            try {
                // Hide auth section
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('navigation').style.display = 'block';
                
                // Get current user
                currentUser = await getCurrentUser();
                displayUser(currentUser);
                
                // Get playlists
                showLoading(document.getElementById('playlistsGrid'), 'Loading playlists...');
                playlists = await getUserPlaylists();
                displayPlaylists(playlists);
                
            } catch (error) {
                showError('Failed to initialize app: ' + error.message);
                logout();
            }
        }

        // Event listeners
        document.getElementById('loginBtn').addEventListener('click', initiateSpotifyLogin);

        // Check for existing token or callback on page load
        window.addEventListener('load', async () => {
            // Check for callback
            if (window.location.search.includes('code=')) {
                await handleCallback();
                return;
            }
            
            // Check for existing token
            const savedToken = localStorage.getItem('spotify_access_token');
            if (savedToken) {
                accessToken = savedToken;
                await initializeApp();
            }
        });
    </script>
